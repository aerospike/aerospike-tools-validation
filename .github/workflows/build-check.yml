# Lightweight installer build check.
#
# Purpose: catch dependency / packaging regressions on every push, before
# they reach the full release pipeline (build-and-release.yml), which builds
# for 9 distros x 2 arches + macOS + signing + notarization.
#
# This exercises both packaging paths (dpkg-deb on Ubuntu, rpmbuild on EL) on
# amd64. macOS pkg builds are left to the release workflow. tests.yml verifies
# the binary build via `make`; this adds the *packaging* step
# (install_deps -> make -> make -C pkg).

name: Build check (installer)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  contents: read

# /bin/sh is dash on Debian/Ubuntu; force bash for `set -o pipefail`.
defaults:
  run:
    shell: bash

env:
  # The C client asvalidation links. Keep in step with .build.yml.
  C_CLIENT_VERSION: "7.3.0"

jobs:
  naming-scripts:
    name: Naming scripts (pkg_release)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install bats
        env:
          BATS_VERSION: "1.11.0"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o /tmp/bats.tgz
          tar -xzf /tmp/bats.tgz -C /tmp
          sudo "/tmp/bats-core-${BATS_VERSION}/install.sh" /usr/local
          bats --version

      - name: Test pkg_release.sh
        run: bats .github/bin/test/pkg_release.bats

      - name: Test check_min_os.sh
        run: bats .github/bin/test/check_min_os.bats

      - name: Test the Build and Release VERSION gate
        run: |
          yq --version
          bats .github/bin/test/validate_inputs.bats

      # The .deb/.rpm legs below only count that a package appeared; nothing
      # asserts the NAME. Assert it here, where the expected name is derived
      # from the same script pkg/Makefile uses, so the two cannot drift.
      - name: Assert package names for an rc version
        run: |
          set -euo pipefail
          release=$(.github/bin/pkg_release.sh 2.3.0-rc3 release)
          pkg_version=$(.github/bin/pkg_release.sh 2.3.0-rc3 version)
          iteration=$(.github/bin/pkg_release.sh 2.3.0-rc3 iteration)
          [[ "${release}" == "2.3.0-3" ]] || { echo "::error::rc3 resolved to release '${release}', expected 2.3.0-3" >&2; exit 1; }

          # make -n so no build deps are needed. Collect only the emitted
          # package paths: the rest of the output includes recipe text that
          # legitimately echoes the rcN version.
          names=$(make -C pkg -n deb rpm VERSION=2.3.0-rc3 BUILD_DISTRO=ubuntu24.04 \
                  | tr ' ' '\n' | grep -E '\.(deb|rpm)$')
          echo "${names}"
          for want in \
            "/aerospike-asvalidation_${pkg_version}-${iteration}ubuntu24.04_" \
            "/aerospike-asvalidation-${pkg_version}-${iteration}.ubuntu24.04."; do
            printf '%s\n' "${names}" | grep -qF -- "${want}" \
              || { echo "::error::expected '${want}' in the emitted package names" >&2; exit 1; }
          done
          if printf '%s\n' "${names}" | grep -qiE 'rc[0-9]'; then
            echo "::error::an rc identifier leaked into a package name" >&2
            exit 1
          fi
          echo "OK: rcN folded into the iteration, absent from all package names"

          # dpkg spells architectures differently from uname and rpm, so assert
          # the mapping rather than trusting whatever arch the runner reports.
          amd=$(make -C pkg -n deb rpm VERSION=2.3.0-rc3 BUILD_DISTRO=ubuntu24.04 ARCH=x86_64 \
                | tr ' ' '\n' | grep -E '\.(deb|rpm)$')
          arm=$(make -C pkg -n deb rpm VERSION=2.3.0-rc3 BUILD_DISTRO=ubuntu24.04 ARCH=aarch64 \
                | tr ' ' '\n' | grep -E '\.(deb|rpm)$')
          for want in "_amd64.deb" ".x86_64.rpm"; do
            printf '%s\n' "${amd}" | grep -qF -- "${want}" \
              || { echo "::error::ARCH=x86_64 did not emit '${want}': ${amd}" >&2; exit 1; }
          done
          for want in "_arm64.deb" ".aarch64.rpm"; do
            printf '%s\n' "${arm}" | grep -qF -- "${want}" \
              || { echo "::error::ARCH=aarch64 did not emit '${want}': ${arm}" >&2; exit 1; }
          done
          echo "OK: deb names carry the dpkg architecture, rpm names the uname one"

  installer-build:
    name: Build .${{ matrix.pkg }} (${{ matrix.distro }}, amd64)
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu24.04, container: 'ubuntu:noble-20251013',      pkg: deb }
          - { distro: ubuntu26.04, container: 'ubuntu:resolute-20260421',   pkg: deb }
          - { distro: el10,        container: 'redhat/ubi10:10.0',          pkg: rpm }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Install prereqs
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              ;;
            el*|amzn*)
              dnf -y install git ca-certificates
              ;;
          esac
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout C client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aerospike/aerospike-client-c
          ref: ${{ env.C_CLIENT_VERSION }}
          submodules: recursive
          path: client

      - name: Install build dependencies
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/bin/install_deps.sh
          "install_deps_${{ matrix.distro }}"

      - name: Build .${{ matrix.pkg }} installer
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          BUILD_DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(cat VERSION)
          export PKG_VERSION
          source .github/bin/build_package.sh
          build_packages

      - name: Verify .${{ matrix.pkg }} produced
        run: |
          set -euo pipefail
          count=$(find target/packages -maxdepth 1 -name "*.${{ matrix.pkg }}" -type f | wc -l)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No .${{ matrix.pkg }} produced under target/packages/." >&2
            ls -la target/packages/ || true
            exit 1
          fi
          echo "Installer build succeeded:"
          find target/packages -maxdepth 1 -name "*.${{ matrix.pkg }}" -type f

  # docker/docker-entrypoint.sh is the image's entrypoint. The release
  # workflow's docker smoke test is the only other thing that executes it, and
  # that is workflow_dispatch-only, so unit-test it here against a fixture on
  # every pull request. Needs no docker and no package.
  docker-entrypoint:
    name: Docker entrypoint (bats)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          bats --version
      - name: Test the docker entrypoint
        run: bats .github/bin/test/test_entrypoint.bats
