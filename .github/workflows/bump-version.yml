# Bump the project version (VERSION file) and open a PR.
#
# Usage: trigger manually via workflow_dispatch, providing a MAJOR.MINOR.PATCH
# version. Merge the PR, then tag the commit that changed VERSION on master.

name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 2.3.1)"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Validate version format
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH (e.g. 2.3.1). Got '$VERSION'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to bump to an existing version
        run: |
          set -euo pipefail
          CURRENT=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || true)
          if [[ -n "$CURRENT" && "$CURRENT" == "$VERSION" ]]; then
            echo "::error::VERSION is already '$VERSION'. Nothing to bump." >&2
            exit 1
          fi
          git fetch --tags --force
          for tag in "$VERSION" "v$VERSION"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag '$tag' already exists. Pick a different version." >&2
              exit 1
            fi
          done

      - name: Create branch and update VERSION
        run: |
          set -euo pipefail
          git checkout -b "version-bump/$VERSION"
          echo "$VERSION" > VERSION
          build/version -v

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git add VERSION
          if git diff --cached --quiet; then
            echo "::error::No file changes. VERSION may already be at '$VERSION'." >&2
            exit 1
          fi
          git commit -m "chore(release): bump version to $VERSION"

      - name: Push branch
        run: git push -u origin "version-bump/$VERSION"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head "version-bump/$VERSION" \
            --title "chore(release): bump version to $VERSION" \
            --body "Bumps VERSION to **$VERSION**. After merging, tag the commit that changed VERSION on master as \`$VERSION\` and build the release from it." \
            --repo "${{ github.repository }}"
