name: Tests

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: make test (client ${{ matrix.client }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 7.3.0 is the client .build.yml pins; 7.6.2 has the depth-limited
        # deserializer the strict differential test compares against.
        client: [ "7.3.0", "7.6.2" ]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev libyaml-dev zlib1g-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          fetch-depth: 0

      - name: Cache C client
        id: cache-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client
          key: c-client-${{ matrix.client }}-ubuntu-24.04

      - name: Checkout C client
        if: steps.cache-client.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aerospike/aerospike-client-c
          ref: ${{ matrix.client }}
          submodules: recursive
          path: client

      - name: Build C client
        if: steps.cache-client.outputs.cache-hit != 'true'
        run: make -j"$(nproc)"
        working-directory: client

      - name: Run tests
        run: make test CLIENTREPO="$GITHUB_WORKSPACE/client"
        working-directory: main

  e2e:
    name: e2e (server 8.1 and 8.2)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev libyaml-dev zlib1g-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          fetch-depth: 0

      - name: Cache C client
        id: cache-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client
          key: c-client-7.6.2-ubuntu-24.04

      - name: Checkout C client
        if: steps.cache-client.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aerospike/aerospike-client-c
          ref: 7.6.2
          submodules: recursive
          path: client

      - name: Build C client
        if: steps.cache-client.outputs.cache-hit != 'true'
        run: make -j"$(nproc)"
        working-directory: client

      - name: Run e2e
        run: make e2e CLIENTREPO="$GITHUB_WORKSPACE/client"
        working-directory: main

      - name: Check the binary reports VERSION
        run: bin/asvalidation --version | grep -xF "Version $(build/version -v)"
        working-directory: main
