service {
	feature-key-file /etc/aerospike/features.conf
	cluster-name asval
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address local
		port 3001
	}
}

namespace d1 {
	replication-factor 1
	storage-engine memory {
		data-size 2G
	}
}

namespace d2m {
	replication-factor 1
	storage-engine memory {
		data-size 2G
	}
}

namespace d2l {
	replication-factor 1
	storage-engine memory {
		data-size 4G
	}
}

namespace d3 {
	replication-factor 1
	storage-engine memory {
		data-size 2G
	}
}

namespace d4a {
	replication-factor 1
	storage-engine memory {
		data-size 2G
	}
}

namespace d4b {
	replication-factor 1
	storage-engine memory {
		data-size 2G
	}
}

namespace d5 {
	replication-factor 1
	storage-engine memory {
		data-size 1G
	}
}
