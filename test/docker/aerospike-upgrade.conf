service {
	feature-key-file /etc/aerospike/features.conf
	cluster-name asval
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address local
		port 3001
	}
}

namespace up {
	replication-factor 1
	storage-engine device {
		file /opt/aerospike/data/up.dat
		filesize 1G
	}
}

namespace up2 {
	replication-factor 1
	storage-engine device {
		file /opt/aerospike/data/up2.dat
		filesize 1G
	}
}
