service {
	cluster-name asval-e2e
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address local
		port 3001
	}
}

namespace test {
	replication-factor 1
	storage-engine device {
		file /opt/aerospike/data/test.dat
		filesize 1G
	}
}
